<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" fill="#FCFBF8"/>
  <!-- Architectural wall planes & shadows -->
  <rect x="0" y="0" width="1200" height="900" fill="#E9E0D2" fill-opacity="0.35"/>
  
  <!-- Perspective shadow gradient -->
  <defs>
    <linearGradient id="wallGrad" x1="100" y1="100" x2="1100" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCFBF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E9E0D2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D5C9B5" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8991B"/>
      <stop offset="100%" stop-color="#9A6500"/>
    </linearGradient>
    <linearGradient id="shadowCast" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171717" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#171717" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Large architectural monoliths -->
  <path d="M150 150 L650 100 L650 820 L150 780 Z" fill="url(#wallGrad)"/>
  <path d="M650 100 L1050 200 L1050 880 L650 820 Z" fill="url(#shadowCast)"/>
  
  <!-- Architectural Arches & Colonade -->
  <path d="M300 780 L300 420 A 120 120 0 0 1 540 420 L540 780 Z" fill="#171717" fill-opacity="0.88"/>
  <path d="M330 780 L330 435 A 90 90 0 0 1 510 435 L510 780 Z" fill="#FCFBF8"/>
  
  <!-- Gold restrained architectural line -->
  <line x1="150" y1="150" x2="1050" y2="200" stroke="url(#goldAcc)" stroke-width="4"/>
  <line x1="650" y1="100" x2="650" y2="820" stroke="url(#goldAcc)" stroke-width="2"/>
  <circle cx="650" cy="100" r="8" fill="#C08000"/>
  
  <!-- Floating architectural plinth -->
  <rect x="720" y="380" width="280" height="340" fill="#111111" rx="2"/>
  <rect x="740" y="400" width="240" height="300" fill="#E9E0D2" rx="2"/>
  <rect x="760" y="420" width="200" height="180" fill="#C08000" fill-opacity="0.85" rx="2"/>

  <!-- Subtle grid and technical markings -->
  <line x1="100" y1="840" x2="1100" y2="840" stroke="#171717" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  <text x="760" y="650" font-family="serif" font-size="16" fill="#171717" letter-spacing="2">SPECIFICATION ARCHIVE</text>
  <text x="760" y="675" font-family="sans-serif" font-size="12" fill="#737373">ARCHITECTURAL PALETTE REF // 2026</text>
</svg>
